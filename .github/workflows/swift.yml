# Build and test lowkey iOS app on every push/PR

name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: List available schemes
      run: xcodebuild -list -project lowkey.xcodeproj
    
    - name: Build
      run: |
        xcodebuild clean build \
          -project lowkey.xcodeproj \
          -scheme lowkey \
          -destination 'platform=iOS Simulator,name=iPhone 15 Pro' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          | xcpretty
      continue-on-error: true
    
    - name: Run tests (if any exist)
      run: |
        xcodebuild test \
          -project lowkey.xcodeproj \
          -scheme lowkey \
          -destination 'platform=iOS Simulator,name=iPhone 15 Pro' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          | xcpretty
      continue-on-error: true
